name: TorchBridge tests and Windows fullscreen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python scripts/run_tests.py
      - run: python scripts/run_tests.py --pattern "test_overlay*.py"
        env:
          QT_SCALE_FACTOR: '1.5'

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/build_fullscreen.py
      - run: ctest --test-dir build/fullscreen -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: torchbridge-fullscreen-x86
          path: assets/native/x86/d3d9.dll
          if-no-files-found: error
