[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchbridge"
version = "0.1.0"
description = "Controller bridge and overlay for Torchlight on Windows and Omarchy Linux"
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FSOUSA SOLUÇÕES" }]
dependencies = [
  "pygame-ce>=2.5.3,<3",
  # PYSIDE-3474: 6.12.0 corrupts singleton refcounts on Python <= 3.11.
  # https://qt-project.atlassian.net/browse/PYSIDE-3474
  "PySide6>=6.8,!=6.12.0,<7; python_version < '3.12'",
  "PySide6>=6.8,<7; python_version >= '3.12'",
]

[project.gui-scripts]
torchbridge = "torchbridge.app:main"

[project.scripts]
torchbridge-calibrar = "torchbridge.calibrate:main"
torchbridge-cenario = "torchbridge.world_inspect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
